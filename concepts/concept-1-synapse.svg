<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#0A0A0C"/>
  <!-- Ribbon X shape - two crossing curved paths -->
  <g transform="translate(200,180) rotate(-15)">
    <!-- Path 1: top-left to bottom-right curve -->
    <path d="M-90,-90 C-60,-50 -20,-30 0,0 C20,30 60,50 90,90" 
          stroke="#1668F7" stroke-width="28" fill="none" stroke-linecap="round"/>
    <!-- Path 2: top-right to bottom-left curve -->
    <path d="M90,-90 C60,-50 20,-30 0,0 C-20,30 -60,50 -90,90" 
          stroke="#1668F7" stroke-width="28" fill="none" stroke-linecap="round"/>
    <!-- Synapse dot at center -->
    <circle cx="0" cy="0" r="18" fill="#1668F7"/>
    <circle cx="0" cy="0" r="8" fill="#0A0A0C"/>
  </g>
  <text x="200" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#FCFBFB" letter-spacing="8">AXONFIT</text>
</svg>
