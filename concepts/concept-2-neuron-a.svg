<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#0A0A0C"/>
  <g transform="translate(200,175)">
    <!-- Letter A as neuron: two side strokes as dendrites, crossbar as axon -->
    <!-- Left dendrite (branching at top) -->
    <path d="M-70,80 L-10,-60" stroke="#1668F7" stroke-width="24" fill="none" stroke-linecap="round"/>
    <path d="M-35,-10 L-55,-50" stroke="#1668F7" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M-25,-25 L-15,-65" stroke="#1668F7" stroke-width="12" fill="none" stroke-linecap="round"/>
    
    <!-- Right dendrite (branching at top) -->
    <path d="M70,80 L10,-60" stroke="#1668F7" stroke-width="24" fill="none" stroke-linecap="round"/>
    <path d="M35,-10 L55,-50" stroke="#1668F7" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M25,-25 L15,-65" stroke="#1668F7" stroke-width="12" fill="none" stroke-linecap="round"/>
    
    <!-- Axon crossbar (the connection) -->
    <line x1="-45" y1="25" x2="45" y2="25" stroke="#1668F7" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Synapse dots at branch tips -->
    <circle cx="-55" cy="-50" r="5" fill="#1668F7"/>
    <circle cx="-15" cy="-65" r="5" fill="#1668F7"/>
    <circle cx="55" cy="-50" r="5" fill="#1668F7"/>
    <circle cx="15" cy="-65" r="5" fill="#1668F7"/>
  </g>
  <text x="200" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#FCFBFB" letter-spacing="8">AXONFIT</text>
</svg>
