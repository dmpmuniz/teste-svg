<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#0A0A0C"/>
  <g transform="translate(200,175)">
    <!-- Left side: dendrite (branching, organic) -->
    <path d="M-80,70 C-70,40 -50,10 -30,-20 C-15,-45 -5,-60 0,-70" 
          stroke="#1668F7" stroke-width="22" fill="none" stroke-linecap="round"/>
    <!-- Dendrite branches -->
    <path d="M-60,30 C-75,15 -90,5 -100,-10" stroke="#1668F7" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M-50,15 C-65,0 -80,-15 -85,-30" stroke="#1668F7" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M-35,-5 C-50,-25 -60,-40 -55,-55" stroke="#1668F7" stroke-width="10" fill="none" stroke-linecap="round"/>
    
    <!-- Right side: muscle fiber (smooth, strong, single line) -->
    <path d="M80,70 C70,40 50,10 30,-20 C15,-45 5,-60 0,-70" 
          stroke="#1668F7" stroke-width="22" fill="none" stroke-linecap="round"/>
    
    <!-- Synapse center point -->
    <circle cx="0" cy="-70" r="10" fill="#1668F7"/>
  </g>
  <text x="200" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#FCFBFB" letter-spacing="8">AXONFIT</text>
</svg>
